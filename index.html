            { id:1040, text: "下列选项中，关于人机交互的说法正确的是哪一项？", options: { A: "人机交互是计算机科学和认知心理学两大科学相结合的产物，同时也吸收了语言学、人机工程学和社会学等科学的研究成果。", B: "人机交互是关于设计、评价和实现供人们使用的交互式计算机系统且围绕这些方面进行研究的科学。", C: "人机交互是指用户与计算机系统之间的通信，是人与计算机之间各种符号和动作的双向信息交换。", D: "人机交互是指通过机器学习算法实现人机对话" }, answer: ["A","B","C"], analysis: "选项D的定义过于狭窄，它只提到了机器学习算法在人机对话中的应用，而人机交互是一个更广泛的概念，不仅仅局限于对话。" },
            { id:1042, text: "下列关于图像分割方法的描述，正确的是（）。", options: { A: "图像分割是将一幅图像分成不同区域或物体的过程", B: "基于阈值的方法是一种常用的图像分割方法", C: "区域生长算法属于基于边缘的图像分割方法", D: "基于区域的方法通常考虑像素之间的相似性" }, answer: ["A","B","D"], analysis: "选项A描述正确，图像分割的定义是将一幅图像划分为若干个区域或物体，每个区域具有不同的特征。选项B描述正确，基于阈值的方法是通过将图像中的像素值与设定的阈值进行比较，进而分割图像。选项C描述错误，区域生长算法是一种基于区域的分割方法，而不是基于边缘的。区域生长法通过逐步合并相似的像素来形成区域，而不是依赖于图像的边缘信息。选项D描述正确，基于区域的图像分割方法（如区域生长法）通常考虑像素之间的相似性，如灰度、颜色等特征，以确定像素是否应当归为同一类。" },
            { id:1044, text: "在人机交互行为模型里，下列关于状态同步交互的说法正确的是？", options: { A: "允许用户与系统共享实时状态信息", B: "系统通过传感器和通信技术动态更新用户状态", C: "状态变化会触发界面反馈", D: "必须依赖加锁机制保证状态一致性" }, answer: ["A","B","C"], analysis: "共享状态交互中，两个或多个并发执行的行为可以共享状态变量，而状态变量可以被所有并发的行为访问。由于并发行为的执行顺序是不确定的，因此需要使用同步机制来保证访问共享状态变量的一致性，而加锁机制只是同步机制的一种。" },
            { id:1045, text: "在回归模型中，下列哪项指标能够用于评估模型的准确性和性能（）。", options: { A: "均方误差（MSE）", B: "平均绝对误差（MAE）", C: "决定系数（R-squared）", D: "对数损失（LogLoss）" }, answer: ["A","B","C"], analysis: "均方误差（MSE）和平均绝对误差（MAE）可以分别用来评估预测值和真实值之间的距离。决定系数（R-squared）用来衡量模型对观测值的解释能力。而对数损失（LogLoss）则主要用于评估分类模型的概率输出质量，如逻辑回归等概率型分类模型。" },
            { id:1046, text: "勤勉好学在基本要求上表现为（）。", options: { A: "对工作充满热情", B: "拥有持续学习的意识", C: "避免与他人交流和合作", D: "保持高度的责任心和工作效率" }, answer: ["A","B","D"], analysis: "勤勉好学的基本要求包括对工作充满热情、拥有持续学习的意识以及保持高度的责任心和工作效率。避免与他人交流和合作不符合勤勉好学的基本要求。" },
            { id:1048, text: "要是想达成提升图形用户界面用户体验的目的，应当（）。", options: { A: "保持界面元素和布局的一致性。", B: "使用复杂的术语来提升界面的专业性。", C: "设计应提供即时反馈，告知用户操作结果。", D: "界面应简单直观，避免过多的功能和选项。" }, answer: ["A","C","D"], analysis: "选项A强调一致性，可以帮助用户快速适应界面，减少认知负担，因此有助于提升用户体验。选项C提到即时反馈，能够让用户明确操作结果，减少不确定性，也有助于增强用户体验。选项D关注界面的简洁性，避免过多的选项，降低学习难度，也是提升用户体验的有效方式。选项B虽然提到“专业性”，但使用复杂术语会增加用户的理解难度，反而降低用户体验。" },
            { id:1049, text: "象限分析法的应用范围主要包括（）。", options: { A: "市场分析", B: "产品分析", C: "客户管理", D: "艺术创作" }, answer: ["A","B","C"], analysis: "象限分析法是指以两个或多个维度为坐标并划分出不同象限，不同象限表示不同的价值导向。象限分析法是典型的策略驱动思维，常见于市场分析、产品分析、客户管理等。" },
            { id:1050, text: "下列选项中，哪一项是计算机所具备的特点（）。", options: { A: "运算速度快", B: "运算精度高", C: "自动化程度高", D: "只有存储功能，没有记忆功能" }, answer: ["A","B","C"], analysis: "计算机的特点包括运算速度快；运算精度高；记忆功能强，存储容量大；具有数据分析和逻辑判断能力；自动化程度高。" },
            { id:1051, text: "对于 ETL 数据整合工具 Kettle 的特点，以下描述正确的是（）。", options: { A: "Kettle是一款开源的ETL工具，支持多种数据源和目标", B: "Kettle提供直观的图形化界面，用户可以通过拖拽组件来构建数据流程", C: "Kettle不支持作业调度和监控。", D: "Kettle支持广泛的数据库和数据文件" }, answer: ["A","B","D"], analysis: "Kettle是一款开源的ETL工具，支持多种数据源和目标，并且提供直观的图形化界面，用户可以通过拖拽组件来构建数据流程。此外，Kettle还支持广泛的数据库和数据文件格式，能够满足多样化的数据处理需求。然而，Kettle并非不支持作业调度和监控，实际上它具备作业调度功能，并可以通过日志和监控工具来跟踪作业状态。" },
            { id:1052, text: "在人机交互研究中，用户体验具有哪些特点？", options: { A: "动态性", B: "情境依赖性", C: "静态性", D: "主观性" }, answer: ["A","B","D"], analysis: "用户体验是指用户对产品的总体主观感受,包含用户在使用产品的过程中所感受到的全部内容总和，具有动态性、情境依赖性和主观性的特点" },
            { id:1054, text: "对于可用性评估的相关方法，下列哪些表述是错误的？（）", options: { A: "诊查式方法主要通过实际用户参与来进行评估", B: "测试式方法通常依赖专家对产品进行分析，而不涉及用户", C: "可用性评估的方法可以帮助发现设计中可能存在的可用性问题，并提供改进建议", D: "在可用性评估中，诊查式方法比测试式方法更注重用户行为的实时反馈" }, answer: ["A","B","D"], analysis: "选项A：诊查式方法并不依赖于实际用户的参与，而是由专家进行分析和评估。例如启发式评估和认知性遍历就是典型的诊查式方法。选项B：测试式方法正是依赖于用户参与的评估方法，如用户测试、问卷调查等。它是通过用户的实际使用行为来评估产品的可用性。选项C：可用性评估的核心目的是发现产品设计中可能存在的可用性问题，并通过不同的评估方法（无论是诊查式方法还是测试式方法）提出改进建议。选项D：诊查式方法的重点在于专家评估，通常并不依赖于实时的用户行为反馈，反而是通过理论分析和经验评估来找出潜在问题。测试式方法才注重用户行为的实时反馈。" },
            { id:1055, text: "下列哪些技术属于自然交互技术的构成部分？（）", options: { A: "多点触控", B: "语音识别", C: "扫描仪图像识别", D: "眼动跟踪" }, answer: ["A","B","D"], analysis: "扫描仪图像识别并不属于自然交互技术，虽然它涉及图像处理，但主要用于图像扫描和存储，而非与用户的自然互动。多点触控技术是自然交互技术的重要组成部分，广泛应用于触摸屏设备中，允许用户通过手指触摸屏幕实现操作。语音识别技术也是自然交互技术的一部分，它通过识别用户的语音命令或指令来实现设备控制。眼动跟踪技术是自然交互技术的一部分，能够通过追踪用户眼球运动来分析其关注点，常用于行为研究和界面优化。" },
            { id:1056, text: "趋势分析法的具体定义是（）。", options: { A: "一种预测方法", B: "对历史数据进行分析", C: "描述变量的变化趋势", D: "基于概率论的方法" }, answer: ["A","B","C"], analysis: "趋势分析法是一种预测方法，它对历史数据进行分析，描述变量的变化趋势。" },
            { id:1057, text: "诚实公正的基本要求包含哪些内容（）。", options: { A: "公正地对待所有相关方", B: "隐瞒重要信息", C: "利用职务之便谋取个人私利", D: "及时、清晰地向相关方提供信息" }, answer: ["A","D"], analysis: "根据诚实公正的基本要求，从业人员要做到以下几点，一、诚实，从业人员应该说实话，不得故意虚假陈述或隐瞒事实。提供准确、真实和完整的信息，不得误导他人。二、公正，从业人员应该公正地对待所有相关方，不偏袒任何一方。基于客观事实和公正标准做出决策和评估。三、透明，从业人员应该及时、清晰地向相关方提供信息，并确保相关方理解信息的真实性和重要性。遵守披露要求，不得隐瞒重要信息。四、忠诚和权益保护，从业人员应该忠诚于雇主或客户的利益，并保护他们的权益。不得利用职务之便谋取个人私利，也不得损害他人的权益。因此AD选项符合题目要求。" },
            { id:1058, text: "下列选项中，属于 NoSQL 数据库的有（）。", options: { A: "HBase", B: "MySQL", C: "Redis", D: "Oracle" }, answer: ["A","C"], analysis: "HBase属于列族数据库，是NoSQL数据库的典型代表，适用于海量数据存储和高并发读写场景。Redis属于键值存储，是内存型NoSQL数据库，常用于缓存、实时数据处理等场景。MySQL和Oracle是传统的关系型数据库，基于SQL语言和表结构，支持ACID事务，属于SQL范畴，而非NoSQL。" },
            { id:1059, text: "下列属于 RFM 模型应用过程中的步骤的有（）。", options: { A: "数据收集", B: "数据分析", C: "数据备份", D: "客户细分" }, answer: ["A","B","D"], analysis: "RFM模型的应用过程是一项系统工程，需要企业从数据收集开始，逐步深入到数据分析、客户细分，最终达到精准营销策略的制定。数据备份不属于RFM模型应用过程的步骤。" },
            { id:1061, text: "业务流程优化可采取的两种方法是（）。", options: { A: "管理分析法", B: "维度分析法", C: "全新设计法", D: "系统化改造法" }, answer: ["C","D"], analysis: "业务流程优化可以采取两种方法完成:一是系统化改造法二是全新设计法。" },
            { id:1067, text: "下列各项中，可能造成决策树模型出现过拟合现象的因素是（）。", options: { A: "样本数量过少", B: "特征数量过多", C: "树的深度过大", D: "使用了较大的训练集" }, answer: ["A","B","C"], analysis: "选项A：样本数量过少可能导致决策树模型无法有效地泛化，容易过拟合。较少的样本使得树在拟合过程中很容易把噪声和特殊情况当作规律，导致对训练数据的记忆而非学习一般规律。选项B：特征选择过多可能导致决策树模型变得非常复杂，增加了树的分裂次数和深度，从而导致过拟合。特别是在某些特征与目标变量没有强相关性的情况下，过多的特征可能使得决策树模型难以找到最优的划分规则。选项C：树的深度过大是导致过拟合的常见原因。过深的树会把训练数据的每一个小变化都考虑进去，导致模型对训练集的过度拟合，从而丧失泛化能力。选项D：使用较大的训练集通常有助于减少过拟合，因为更多的数据可以提供更多的信息，有助于模型学习到数据的总体规律。" },
            { id:1068, text: "对于回归模型的预测结果，可用哪项指标来衡量其预测精度和稳定性（）。", options: { A: "残差标准差", B: "均值", C: "置信区间", D: "均方根误差（RMSE）" }, answer: ["A","C","D"], analysis: "残差标准差用于衡量回归模型残差的离散程度，可有效评估模型的稳定性。较小的残差标准差表示模型预测结果的波动更小，稳定性更高，因此残差标准差是评估回归模型稳定性的有效指标。均值是描述数据集中趋势的指标，但它不能有效衡量预测精度或稳定性，尤其在回归模型的评估中，不常用于衡量预测的精度和稳定性。因此，均值不是一个有效的选择。置信区间用于表示估计结果的可靠性和不确定性，可以用来衡量预测结果的可信度，从而间接评估预测的稳定性。它在回归分析中常常被使用，因此是一个有效的选择。均方根误差（RMSE）是回归模型中常用的评估指标，衡量模型预测值与真实值之间的差异，是评估预测精度的常见指标。" },
            { id:1069, text: "在初级培训知识点里，数据标注的培训内容包含哪一项（）。", options: { A: "脚本标注", B: "文本标注", C: "语音标注", D: "视觉标注" }, answer: ["B","C","D"], analysis: "文本标注、语音标注、视觉标注属于初级级培训知识点中数据标注的培训内容。" },
            { id:1070, text: "下列属于 Kettle 所具备的特点的有（）。", options: { A: "开源软件", B: "图形化操作", C: "数据备份和恢复", D: "数据可视化和报表" }, answer: ["A","B"], analysis: "作为广受用户欢迎的ETL工具，Kettle具有以下特点。开源软件，可以在多个常用的操作系统下运行。图形化操作，使用十分简单与方便。支持多种常用数据库和文件的数据格式，适应范围广。具有完整的工作流控制，能够较好地控制复杂的数据转换工作。提供定时调度功能，方便用户及时处理数据。" },
            { id:1071, text: "关于 “以用户为中心的设计” 所具备的特点，哪些是正确的？（）", options: { A: "设计过程中主要关注技术的可行性和产品功能的复杂性，而不太考虑最终用户的需求。", B: "设计需要充分了解并考虑目标用户的需求、期望和使用场景，以提升用户的使用体验。", C: "以用户为中心的设计强调从用户的角度出发进行产品设计，并且关注产品的有效性、效率和用户的主观满意度。", D: "在设计过程中，用户的反馈是可选的，设计师可以根据个人经验来调整设计，而不需要依赖用户反馈。" }, answer: ["B","C"], analysis: "以用户为中心的设计强调以最终用户为核心，设计时需深入了解用户的需求、期望和实际使用场景，以提高产品的有效性、效率和用户满意度。选项B和C完全符合这一理念。选项A忽视了用户需求的核心地位，选项D则错误地将用户反馈视为可选，实际上，用户反馈在设计中是至关重要的。" },
            { id:1072, text: "中级知识体系所涵盖的模块有哪几项（）。", options: { A: "excel操作", B: "数据标注", C: "数据采集和处理", D: "智能系统运维" }, answer: ["B","C","D"], analysis: "中级知识体系包含数据标注、数据采集和处理、智能系统运维等模块。" },
            { id:1073, text: "在从事职业工作的过程中，什么样的行为是与职业道德要求相违背的（）。", options: { A: "向同事请教遇到的难题", B: "在工作中撒谎掩盖错误", C: "给客户提供虚假的服务内容", D: "将客户个人信息泄露给他人" }, answer: ["B","C","D"], analysis: "在职业工作中，诚实守信和保护客户隐私是职业道德的重要要求。撒谎掩盖错误、提供虚假服务内容和泄露客户个人信息都是违背职业道德的不良行为。相反，向同事请教遇到的难题可以促进团队合作和完成工作任务，符合职业道德要求。" },
            { id:1074, text: "下列哪项方法能够有效减轻算法的过拟合问题（）。", options: { A: "增加正则化项", B: "提高学习率", C: "增加训练数据集大小", D: "增加神经网络的层数" }, answer: ["A","C"], analysis: "算法过拟合指的是模型过于复杂，导致在训练数据上表现很好，但在测试数据上表现较差。为减少过拟合，常用的方法包括：增加正则化项：正则化（如L1或L2正则化）通过在损失函数中加入惩罚项来限制模型的复杂度，防止模型对训练数据过拟合。提高学习率：提高学习率不会减少过拟合，反而可能导致训练过程不稳定，因此这不是有效的减少过拟合的方法。增加训练数据集大小：更多的训练数据有助于提高模型的泛化能力，从而减少对训练数据的过拟合。增加神经网络的层数：增加神经网络的层数会增加模型的复杂度，从而加剧过拟合的风险。" },
            { id:1078, text: "在下列关于人机交互的例子中，哪一项的描述不符合第二代人机交互方式的交互原理？（）", options: { A: "语音助手Siri和智能音箱小爱同学", B: "全息投影技术和虚拟现实眼镜", C: "触屏手机和平板电脑", D: "虚拟助手" }, answer: ["A","B","D"], analysis: "第二代人机交互逻辑主要指通过图形用户界面（GUI）与计算机或设备进行交互。触摸屏手机和平板电脑符合这一标准，因为它们通过图形界面和直接触控实现操作。而语音助手、智能音箱、虚拟助手及虚拟现实技术则不依赖图形界面，因此不符合第二代人机交互的逻辑。" },
            { id:1079, text: "当 Word 提供的内置样式和主题中的格式设置选项不能满足使用需求时，还能进行哪些进一步的操作（）。", options: { A: "可以在文档中选择带格式的文本，以在样式库中创建新样式", B: "只能通过修改标题样式调整格式", C: "可以修改现有样式并对其进行自定义以满足需求", D: "可以删掉样式" }, answer: ["A","C"], analysis: "如果想要在Word中提供的内置样式和主题中不可用的格式设置选项，可以修改现有样式并对其进行自定义以满足需求。 可以在应用于标题、标题、段落、列表等的样式中更改格式（如字号、颜色和文本缩进）。 还可以在文档中选择带格式的文本，以在样式库中创建新样式。删掉样式无法解决问题。" },
            { id:1080, text: "业务流程重组（BPR）有哪些实施方法（）。", options: { A: "在研究和描述企业现有业务流程的基础上进行重新设计", B: "从一张白纸开始构建企业理想的业务流程", C: "完全依赖外部咨询公司的建议，不进行内部研究", D: "参考相关企业的管理水准进行构建" }, answer: ["A","B","D"], analysis: "业务流程重组（BPR）的实施方法包括：在研究和描述企业现有业务流程的基础上进行重新设计（A），从一张白纸开始构建企业理想的业务流程（B），以及参考相关企业的管理水准进行构建（D）。完全依赖外部咨询公司的建议而不进行内部研究（C）并不是一种推荐的实施方法。" },
            { id:1081, text: "在中级培训中，智能系统运维所涵盖的知识点有哪些？（）", options: { A: "智能应用方法", B: "数据整理方法", C: "标注工具使用方法", D: "数据分析基础方法" }, answer: ["A","D"], analysis: "在中级培训中，智能系统运维涉及到的知识点包括智能应用方法、数据分析基础方法。" }
        ];

        // ---------- 记忆功能 ----------
        const MEMORY_KEY = "multichoice_memory_v1";

        // 登录逻辑
        const LOGIN = { username: "admin", password: "123456" };
        let loggedIn = false;

        // 错题管理
        let wrongSet = new Set();
        const WRONG_KEY = "multichoice_wrong_ids_v3";

        function loadWrongSet() {
            const stored = localStorage.getItem(WRONG_KEY);
            if(stored) {
                try { wrongSet = new Set(JSON.parse(stored)); } catch(e){}
            }
            updateStats();
        }
        function saveWrongSet() {
            localStorage.setItem(WRONG_KEY, JSON.stringify([...wrongSet]));
            updateStats();
        }
        function markWrong(qid, isWrong) {
            if(isWrong) {
                if(!wrongSet.has(qid)) wrongSet.add(qid);
            } else {
                if(wrongSet.has(qid)) wrongSet.delete(qid);
            }
            saveWrongSet();
        }
        function updateStats() {
            document.getElementById("totalCount").innerText = `${FULL_QUESTIONS.length}题`;
            document.getElementById("wrongCount").innerHTML = `📕 错题 ${wrongSet.size}`;
            if(currentMode === "wrong") renderWrongBook();
        }

        // 当前状态
        let currentMode = "quiz";
        let currentIndex = 0;

        // 保存记忆 (模式 + 索引)
        function saveMemory() {
            const mem = {
                mode: currentMode,
                index: currentIndex
            };
            localStorage.setItem(MEMORY_KEY, JSON.stringify(mem));
        }

        function loadMemory() {
            const stored = localStorage.getItem(MEMORY_KEY);
            if(stored) {
                try {
                    const mem = JSON.parse(stored);
                    if(mem.mode === "quiz" || mem.mode === "wrong") currentMode = mem.mode;
                    if(typeof mem.index === 'number' && mem.index >= 0 && mem.index < FULL_QUESTIONS.length) {
                        currentIndex = mem.index;
                    }
                } catch(e){}
            }
        }

        // 获取完整正确答案 (仅字母)
        function getCorrectLetters(q) {
            return q.answer.join("、");
        }

        // 渲染刷题卡片
        function renderQuizCard() {
            if(currentMode !== "quiz") return;
            const q = FULL_QUESTIONS[currentIndex];
            if(!q) return;
            const optsHtml = Object.entries(q.options).map(([key,val]) => `
                <label class="option-row">
                    <input type="checkbox" name="quizOption" value="${key}">
                    <span><strong>${key}.</strong> ${val}</span>
                </label>
            `).join("");
            const html = `
                <div class="quiz-panel">
                    <div class="progress-row">
                        <span class="counter">第 ${currentIndex+1} / ${FULL_QUESTIONS.length} 题</span>
                        <div class="nav-group">
                            <button id="prevBtn">◀ 上一题</button>
                            <button id="nextBtn">下一题 ▶</button>
                        </div>
                    </div>
                    <div class="jump-box">
                        <span>跳转到题号：</span>
                        <input type="number" id="jumpInput" min="1" max="${FULL_QUESTIONS.length}" placeholder="序号">
                        <button id="jumpBtn">跳转</button>
                    </div>
                    <div class="question-text">${q.text}</div>
                    <div class="options-area">${optsHtml}</div>
                    <div class="action-row">
                        <button class="btn-submit" id="submitBtn">📌 提交核对</button>
                    </div>
                    <div id="feedbackBox" class="feedback-box">⚡ 选择选项后提交，将显示正确答案(仅字母)与解析</div>
                </div>
            `;
            document.getElementById("contentArea").innerHTML = html;

            // 绑定事件
            document.getElementById("prevBtn").onclick = () => { if(currentIndex>0) currentIndex--; else currentIndex=FULL_QUESTIONS.length-1; renderQuizCard(); saveMemory(); };
            document.getElementById("nextBtn").onclick = () => { if(currentIndex<FULL_QUESTIONS.length-1) currentIndex++; else currentIndex=0; renderQuizCard(); saveMemory(); };
            document.getElementById("jumpBtn").onclick = () => {
                const val = parseInt(document.getElementById("jumpInput").value);
                if(!isNaN(val) && val>=1 && val<=FULL_QUESTIONS.length) {
                    currentIndex = val-1;
                    renderQuizCard();
                    saveMemory();
                } else alert("请输入有效题号 (1-"+FULL_QUESTIONS.length+")");
            };
            document.getElementById("submitBtn").onclick = () => {
                const selected = Array.from(document.querySelectorAll('input[name="quizOption"]:checked')).map(cb => cb.value);
                const correctAns = q.answer;
                const sortedCorrect = [...correctAns].sort();
                const sortedUser = [...selected].sort();
                const isCorrect = JSON.stringify(sortedCorrect) === JSON.stringify(sortedUser);
                markWrong(q.id, !isCorrect);
                const fb = document.getElementById("feedbackBox");
                const correctLetters = getCorrectLetters(q);
                if(isCorrect) {
                    fb.className = "feedback-box correct";
                    fb.innerHTML = `<div class="answer-detail">✅ 回答正确！</div><div>📖 正确答案：${correctLetters}</div><div class="analysis">📝 解析：${q.analysis || '（无解析）'}</div>`;
                } else {
                    fb.className = "feedback-box wrong";
                    fb.innerHTML = `<div class="answer-detail">❌ 回答错误，已加入错题本</div><div>📖 正确答案：${correctLetters}</div><div class="analysis">📝 解析：${q.analysis || '（无解析）'}</div>`;
                }
                updateStats();
                saveMemory();
            };
        }

        // 错题本渲染
        function renderWrongBook() {
            if(currentMode !== "wrong") return;
            const wrongIds = [...wrongSet];
            if(wrongIds.length === 0) {
                document.getElementById("contentArea").innerHTML = `<div class="empty-state">📭 暂无错题，继续刷题～</div>`;
                return;
            }
            const wrongQs = FULL_QUESTIONS.filter(q => wrongSet.has(q.id));
            let html = `<div class="wrong-list">`;
            wrongQs.forEach(q => {
                const optsHtml = Object.entries(q.options).map(([key,val]) => `<span style="margin-right:12px;"><strong>${key}.</strong> ${val}</span>`).join("");
                html += `
                    <div class="wrong-card">
                        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;">
                            <span style="font-weight:700;">🔖 题号 ${q.id}</span>
                            <span class="badge wrong-badge">错题本</span>
                        </div>
                        <div style="font-size:1.1rem;margin:8px 0;">${q.text}</div>
                        <div class="wrong-options">${optsHtml}</div>
                        <button class="btn-practice" data-id="${q.id}">✏️ 练习此题</button>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById("contentArea").innerHTML = html;
            document.querySelectorAll(".btn-practice").forEach(btn => {
                btn.onclick = () => {
                    const qid = parseInt(btn.dataset.id);
                    const idx = FULL_QUESTIONS.findIndex(q => q.id === qid);
                    if(idx !== -1) {
                        currentMode = "quiz";
                        currentIndex = idx;
                        saveMemory();
                        document.querySelector(".mode-tab[data-mode='quiz']").click();
                    }
                };
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            saveMemory();
            document.querySelectorAll(".mode-tab").forEach(tab => tab.classList.remove("active"));
            document.querySelector(`.mode-tab[data-mode='${mode}']`).classList.add("active");
            if(mode === "quiz") renderQuizCard();
            else renderWrongBook();
            updateStats();
        }

        // 登录与退出
        document.getElementById("loginBtn").onclick = () => {
            const u = document.getElementById("usernameInput").value.trim();
            const p = document.getElementById("passwordInput").value.trim();
			isLoggedIn = true
			if ((u === 'admin' && p === 'admin_123')) {
                loggedIn = true;
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
                loadWrongSet();
                loadMemory();
                switchMode(currentMode);             
            } else if ((u === 'user' && p === 'user_123456')) {
				loggedIn = true;
				document.getElementById("loginScreen").classList.add("hidden");
				document.getElementById("mainApp").classList.remove("hidden");
				loadWrongSet();
				loadMemory();
				switchMode(currentMode);         
            } else {
                document.getElementById("loginError").style.display = "block";
				return;
            }
            
        };
        document.getElementById("logoutBtn").onclick = () => {
            loggedIn = false;
            document.getElementById("loginScreen").classList.remove("hidden");
            document.getElementById("mainApp").classList.add("hidden");
            document.getElementById("loginError").style.display = "none";
        };
        document.getElementById("passwordInput").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("loginBtn").click(); });
        document.getElementById("usernameInput").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("loginBtn").click(); });

        document.querySelectorAll(".mode-tab").forEach(tab => {
            tab.onclick = () => switchMode(tab.dataset.mode);
        });
        document.getElementById("clearWrongBtn").onclick = () => {
            wrongSet.clear();
            saveWrongSet();
            if(currentMode === "wrong") renderWrongBook();
            else updateStats();
        };
        // 初始化
        loadWrongSet();
        // 预加载记忆，但登录后才应用
    })();
</script>
</body>
</html>
