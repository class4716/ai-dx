<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>多选精练·记忆版｜自动保存进度+错题本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            padding: 24px 20px 60px;
            color: #0a2540;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 头部卡片 */
        .hero {
            background: white;
            border-radius: 40px;
            padding: 20px 28px;
            margin-bottom: 28px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f3e5c, #0f2c44);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title p {
            color: #4a627a;
            font-size: 0.85rem;
        }
        .stats {
            display: flex;
            gap: 20px;
            background: #f0f4f9;
            padding: 6px 20px;
            border-radius: 60px;
            align-items: center;
        }
        .badge {
            font-weight: 600;
            background: white;
            padding: 5px 16px;
            border-radius: 40px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .wrong-badge {
            background: #ffe6e5;
            color: #b91c1c;
        }
        .btn-clear {
            background: #fff0ef;
            border: 1px solid #fcd9d8;
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-clear:hover {
            background: #fdd8d6;
        }
        .memory-tip {
            font-size: 0.7rem;
            background: #eef2ff;
            border-radius: 20px;
            padding: 4px 12px;
            color: #1f5e8c;
        }

        /* tab */
        .mode-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
            border-bottom: 2px solid #dce5ef;
            padding-bottom: 8px;
        }
        .mode-btn {
            background: none;
            border: none;
            font-size: 1.05rem;
            font-weight: 600;
            padding: 6px 10px;
            color: #5b6f88;
            cursor: pointer;
            border-radius: 0;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: 0.2s;
        }
        .mode-btn.active {
            color: #1f5e8c;
            border-bottom-color: #1f5e8c;
        }

        /* 主卡片 */
        .quiz-card {
            background: white;
            border-radius: 36px;
            padding: 2rem 2rem 2rem 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #e2edf7;
        }
        .counter {
            background: #eef3fc;
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .nav-group {
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: #f0f4fa;
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: #e2eaf3;
        }
        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 16px 0 24px;
            color: #0a2b3e;
        }
        .options-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0 28px;
            background: #fafdff;
            padding: 20px 24px;
            border-radius: 28px;
            border: 1px solid #eef2f8;
        }
        .option-row {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .option-row:hover {
            background: #eef3fc;
        }
        .option-row input {
            width: 20px;
            height: 20px;
            accent-color: #2c6e9e;
            cursor: pointer;
        }
        .action-row {
            margin: 12px 0 18px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-submit {
            background: #1f5e8c;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-submit:hover {
            background: #0f466b;
            transform: translateY(-1px);
        }
        .feedback {
            background: #f8fafd;
            padding: 16px 20px;
            border-radius: 28px;
            margin-top: 16px;
            line-height: 1.5;
            border-left: 6px solid #cbd5e1;
        }
        .feedback.correct {
            background: #e1f7ec;
            border-left-color: #2b7e4b;
            color: #145c33;
        }
        .feedback.wrong {
            background: #ffeaea;
            border-left-color: #c2412c;
            color: #9b2c1d;
        }
        .wrong-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .wrong-card {
            background: white;
            border-radius: 28px;
            padding: 1.4rem;
            border: 1px solid #ffdede;
        }
        .wrong-header {
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .wrong-options {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 12px 0;
        }
        .wrong-opt {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-practice {
            background: #eef2fa;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 70px 20px;
            background: white;
            border-radius: 48px;
            color: #8ba0bc;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.75rem;
            color: #8ba0bc;
        }
        @media (max-width: 650px) {
            .quiz-card { padding: 1.5rem; }
            .question-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="hero">
        <div class="title">
            <h1>📚 多选专项 · 记忆刷题</h1>
            <p>每题提交即见正确答案 | 自动保存进度 & 错题本</p>
        </div>
        <div class="stats">
            <span class="badge" id="totalCount">0题</span>
            <span class="badge wrong-badge" id="wrongCount">📘 错题 0</span>
            <button id="clearWrongBtn" class="btn-clear">🗑 清空错题本</button>
            <span class="memory-tip">💾 自动记忆刷题位置</span>
        </div>
    </div>

    <div class="mode-tabs">
        <button class="mode-btn active" data-mode="quiz">✍️ 刷题模式</button>
        <button class="mode-btn" data-mode="wrong">📕 我的错题本</button>
    </div>

    <div id="mainContent">
        <!-- 动态渲染刷题卡片或错题列表 -->
        <div class="quiz-card" id="quizPanel">
            <div class="progress-bar">
                <span class="counter" id="questionCounter">第1 / ?题</span>
                <div class="nav-group">
                    <button id="prevBtn" class="nav-btn">◀ 上一题</button>
                    <button id="nextBtn" class="nav-btn">下一题 ▶</button>
                </div>
            </div>
            <div id="dynamicArea">
                <!-- 题目选项动态加载 -->
            </div>
        </div>
    </div>
    <footer>✅ 多选题完全匹配正确答案（选项顺序无关）。每次提交显示完整正确答案，错误自动进入错题库。<br>⚡ 当前进度、错题本、界面模式都会自动保存，刷新或下次访问继续刷题。</footer>
</div>

        WRONG_SET: "multichoice_wrong_ids_v2",
        CURRENT_MODE: "multichoice_current_mode",
        CURRENT_INDEX: "multichoice_current_index"
    };

    // 错题管理
    let wrongSet = new Set();

    function loadWrongSet() {
        const stored = localStorage.getItem(STORAGE_KEYS.WRONG_SET);
        if(stored) {
            try { wrongSet = new Set(JSON.parse(stored)); } catch(e) { wrongSet = new Set(); }
        }
        updateStatsUI();
    }
    function saveWrongSet() {
        localStorage.setItem(STORAGE_KEYS.WRONG_SET, JSON.stringify([...wrongSet]));
        updateStatsUI();
    }
    function updateStatsUI() {
        document.getElementById("totalCount").innerText = `${FULL_QUIZ.length}题`;
        document.getElementById("wrongCount").innerHTML = `📘 错题 ${wrongSet.size}`;
        if(currentMode === "wrong") renderWrongBook();
    }
    function markWrong(qid, isWrong) {
        if(isWrong) {
            if(!wrongSet.has(qid)) wrongSet.add(qid);
        } else {
            if(wrongSet.has(qid)) wrongSet.delete(qid);
        }
        saveWrongSet();
    }

    // 获取完整正确答案文本
    function getFullCorrectAnswer(question) {
        return question.ans.map(letter => `${letter}. ${question.opts[letter]}`).join("  ；  ");
    }

    // 刷题模式变量
    let currentIndex = 0;
    let currentMode = "quiz";   // quiz / wrong

    // ---------- 记忆保存 ----------
    function saveCurrentState() {
        localStorage.setItem(STORAGE_KEYS.CURRENT_MODE, currentMode);
        if(currentMode === "quiz") {
            localStorage.setItem(STORAGE_KEYS.CURRENT_INDEX, currentIndex);
        } else {
            // 错题本模式不记忆刷题索引，但为了下次切回保留上次刷题进度，我们依然存储最后一次quiz的索引，不影响错题本
            localStorage.setItem(STORAGE_KEYS.CURRENT_INDEX, currentIndex);
        }
    }

    function loadSavedState() {
        const savedMode = localStorage.getItem(STORAGE_KEYS.CURRENT_MODE);
        const savedIndex = localStorage.getItem(STORAGE_KEYS.CURRENT_INDEX);
        if(savedMode === "quiz" || savedMode === "wrong") currentMode = savedMode;
        if(savedIndex !== null && !isNaN(parseInt(savedIndex))) {
            let idx = parseInt(savedIndex);
            if(idx >= 0 && idx < FULL_QUIZ.length) currentIndex = idx;
        }
    }

    // 渲染刷题卡片
    function renderQuizCard() {
        if(currentMode !== "quiz") return;
        const q = FULL_QUIZ[currentIndex];
        if(!q) return;
        const optsHtml = Object.entries(q.opts).map(([key,val]) => `
            <label class="option-row">
                <input type="checkbox" name="quizOption" value="${key}">
                <span><strong>${key}.</strong> ${val}</span>
            </label>
        `).join("");
        const dynamicHtml = `
            <div class="question-text">${q.text}</div>
            <div class="options-panel" id="optionsPanel">${optsHtml}</div>
            <div class="action-row">
                <button id="submitBtn" class="btn-submit">📌 提交并核对答案</button>
            </div>
            <div id="feedbackArea" class="feedback">⚡ 请选择选项后提交，将显示完整正确答案</div>
        `;
        document.getElementById("dynamicArea").innerHTML = dynamicHtml;
        document.getElementById("questionCounter").innerHTML = `第 ${currentIndex+1} / ${FULL_QUIZ.length} 题`;

        const submitBtn = document.getElementById("submitBtn");
        if(submitBtn) {
            submitBtn.onclick = () => {
                const selected = Array.from(document.querySelectorAll('input[name="quizOption"]:checked')).map(cb => cb.value);
                const correctAnsLetters = q.ans;
                const sortedCorrect = [...correctAnsLetters].sort();
                const sortedUser = [...selected].sort();
                const isCorrect = JSON.stringify(sortedCorrect) === JSON.stringify(sortedUser);
                markWrong(q.id, !isCorrect);
                const fullCorrectText = getFullCorrectAnswer(q);
                const fbDiv = document.getElementById("feedbackArea");
                if(isCorrect) {
                    fbDiv.innerHTML = `✅ 回答正确！<br>📖 正确答案：${fullCorrectText}<br>🎉 很棒，继续下一题~`;
                    fbDiv.className = "feedback correct";
                } else {
                    fbDiv.innerHTML = `❌ 回答错误！<br>📖 正确答案：${fullCorrectText}<br>📌 本题已自动加入错题库，请复习。`;
                    fbDiv.className = "feedback wrong";
                }
                updateStatsUI();
                saveCurrentState();
            };
        }
        saveCurrentState();
    }

    // 错题本渲染
    function renderWrongBook() {
        if(currentMode !== "wrong") return;
        const wrongIdsArr = [...wrongSet];
        if(wrongIdsArr.length === 0) {
            document.getElementById("mainContent").innerHTML = `<div class="empty-state">📭 暂无错题，继续刷题～<br>答错的题目会显示在这里</div>`;
            return;
        }
        const wrongQuestions = FULL_QUIZ.filter(q => wrongSet.has(q.id));
        let listHtml = `<div class="wrong-list">`;
        wrongQuestions.forEach(q => {
            const optsHtml = Object.entries(q.opts).map(([key,val]) => `<div class="wrong-opt"><strong>${key}.</strong> ${val}</div>`).join("");
            listHtml += `
                <div class="wrong-card">
                    <div class="wrong-header"><span>🔖 题号 ${q.id}</span><span class="badge">错题本</span></div>
                    <div class="question-text" style="font-size:1.1rem; margin:10px 0">${q.text}</div>
                    <div class="wrong-options">${optsHtml}</div>
                    <button class="btn-practice" data-id="${q.id}">✏️ 练习此题（跳转刷题模式）</button>
                </div>
            `;
        });
        listHtml += `</div>`;
        document.getElementById("mainContent").innerHTML = listHtml;
        document.querySelectorAll(".btn-practice").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const qid = parseInt(btn.getAttribute("data-id"));
                const targetIdx = FULL_QUIZ.findIndex(q => q.id === qid);
                if(targetIdx !== -1) {
                    currentMode = "quiz";
                    currentIndex = targetIdx;
                    saveCurrentState();
                    document.querySelector(".mode-btn[data-mode='quiz']").click();
                }
            });
        });
    }

    function switchToMode(mode) {
        currentMode = mode;
        saveCurrentState();
        if(mode === "quiz") {
            document.getElementById("mainContent").innerHTML = `
                <div class="quiz-card" id="quizPanel">
                    <div class="progress-bar">
                        <span class="counter" id="questionCounter">第1 / ?题</span>
                        <div class="nav-group">
                            <button id="prevBtn" class="nav-btn">◀ 上一题</button>
                            <button id="nextBtn" class="nav-btn">下一题 ▶</button>
                        </div>
                    </div>
                    <div id="dynamicArea"></div>
                </div>
            `;
            renderQuizCard();
            bindNavEvents();
        } else {
            renderWrongBook();
        }
        document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
        document.querySelector(`.mode-btn[data-mode='${mode}']`).classList.add("active");
        updateStatsUI();
    }

    function bindNavEvents() {
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        if(prevBtn) {
            prevBtn.onclick = () => {
                if(currentMode !== "quiz") return;
                if(currentIndex > 0) currentIndex--;
                else currentIndex = FULL_QUIZ.length - 1;
                renderQuizCard();
                bindNavEvents();
                saveCurrentState();
            };
        }
        if(nextBtn) {
            nextBtn.onclick = () => {
                if(currentMode !== "quiz") return;
                if(currentIndex < FULL_QUIZ.length - 1) currentIndex++;
                else currentIndex = 0;
                renderQuizCard();
                bindNavEvents();
                saveCurrentState();
            };
        }
    }

    // 清空错题本
    document.getElementById("clearWrongBtn").addEventListener("click", () => {
        wrongSet.clear();
        saveWrongSet();
        if(currentMode === "wrong") renderWrongBook();
        else updateStatsUI();
        saveCurrentState();
    });

    // 初始化：加载记忆+构建UI
    function init() {
        loadWrongSet();
        loadSavedState();
        // 注册模式切换
        document.querySelectorAll(".mode-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const mode = btn.getAttribute("data-mode");
                switchToMode(mode);
            });
        });
        switchToMode(currentMode);
    }
    init();
</script>
</body>
</html>
